# config/ratings_manual.yaml -- hand-maintained race ratings, the day-one fallback fair value.
#
# Loaded by sigcup.feeds.polls.load_manual_ratings() on every polls run (idempotent: a row is written only
# when the latest stored rating for (race_id, source) differs). Each entry:
#   race_id    SEN-XX | GOV-XX | HOUSE-XX-NN | CONTROL-SENATE | CONTROL-HOUSE   (see config/races.yaml)
#   rating     Safe/Solid/Likely/Lean/Tilt + D/R, or Toss-up (any spelling the normaliser accepts)
#   source     who said it: cook | sabato | inside | split | rttwh | manual (default manual)
#   as_of      YYYY-MM-DD (defaults to the top-level as_of); stored as the Rating.ts (00:00 UTC)
#   prob_dem   optional explicit P(Democrat) overriding the rating -> probability table in settings.yaml
#              (fairvalue.ratings_prob: safe .97, likely .85, lean .68, tilt .58, tossup .50)
#   note       free text
#
# Provenance: docs/research/platform.md section 6 (Cook Oct 6 Senate, Cook Oct 1 governors, Cook Oct 9 House,
# Sabato Oct 6, Inside Elections Oct 1). Entries marked "seed guess" are NOT published ratings: they are
# incumbency/PVI placeholders for races the research does not document, to be replaced by the collectors
# (Sabato/Cook/RTTWH/270toWin pages) or by hand.
